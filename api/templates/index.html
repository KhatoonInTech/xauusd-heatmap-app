<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Industrial Liquidity Matrix</title>
    <style>
        /* --- COPY OF YOUR STYLE.CSS TRUCKENED DIRECTLY INLINE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #020617; /* Deep Slate 950 */
            color: #ffffff;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
        }
        .main-header {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
            max-width: 960px;
        }
        .main-header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #f97316; /* Thermal Orange */
        }
        .main-header .subtitle {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }
        .chart-wrapper {
            width: 100%;
            max-width: 960px;
            background-color: #0f172a; /* Slate 900 */
            border: 1px solid #1e293b; /* Slate 800 */
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        .canvas-scroll-container {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }
        #heatmapCanvas {
            min-width: 920px;
            height: 480px;
            background-color: #020617;
            border-radius: 6px;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .main-footer {
            margin-top: 16px;
            text-align: center;
            font-size: 12px;
            color: #475569;
        }
    </style>
</head>
<body>
    
    <header class="main-header">
        <h1>XAUUSD LIQUIDITY HEATMAP ENGINE</h1>
        <p class="subtitle">Vercel Serverless Architecture Deployment Frame</p>
        <div style="margin-top: 12px;">
            <button id="sourceToggleBtn" style="background: #1e293b; border: 1px solid #334155; color: #fff; padding: 6px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; font-family: monospace;">
                MODE: AUTO-SWITCHING
            </button>
        </div>
    </header>

    <main class="chart-wrapper">
        <div class="canvas-scroll-container">
            <div id="canvasLoaderFallback" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #475569; font-family: monospace; font-size: 14px; pointer-events: none; text-align: center; width: 100%;">
                INITIALIZING PACKET CONNECTIONS...
            </div>
            <canvas id="heatmapCanvas" width="960" height="540"></canvas>
        </div>
    </main>

    <footer class="main-footer">
        <p>Status: Synchronizing network data pipelines...</p>
    </footer>

    <!-- --- COPY OF YOUR APP.JS CANVAS GENERATOR ENGINE EMBEDDED DIRECTLY INLINE --- -->
    <script>
        (function () {
            const canvas = document.getElementById('heatmapCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const footerText = document.querySelector('.main-footer p');
            const fallbackLabel = document.getElementById('canvasLoaderFallback');

            function renderMatrixFrame(heatmap, candles) {
                if (!heatmap || heatmap.length === 0 || !candles || candles.length === 0) return;

                if (fallbackLabel) fallbackLabel.style.display = "none";
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const prices = heatmap.map(item => item.price);
                const maxPrice = Math.max(...prices);
                const minPrice = Math.min(...prices);
                const priceDelta = maxPrice - minPrice;

                if (priceDelta === 0) return;

                function projectPriceToY(price) {
                    return canvas.height - (((price - minPrice) / priceDelta) * canvas.height);
                }

                // 1. Heatmap Blocks
                const volumes = heatmap.map(item => item.vol);
                const maxVolume = Math.max(...volumes);

                for (let i = 0; i < heatmap.length; i++) {
                    const layer = heatmap[i];
                    const pixelY = projectPriceToY(layer.price);
                    const opacity = maxVolume > 0 ? Math.min(1, (layer.vol / maxVolume) * 2.0) : 0.2;
                    ctx.fillStyle = "rgba(249, 115, 22, " + opacity + ")";
                    ctx.fillRect(0, Math.floor(pixelY), canvas.width, 4);
                }

                // 2. Candlesticks Overlay
                const nodeWidth = 14;
                const nodeGap = 6;
                const horizontalPaddingLeft = 60;

                for (let j = 0; j < candles.length; j++) {
                    const candle = candles[j];
                    const pixelX = horizontalPaddingLeft + j * (nodeWidth + nodeGap);

                    const yOpen  = projectPriceToY(candle.open);
                    const yClose = projectPriceToY(candle.close);
                    const yHigh  = projectPriceToY(candle.high);
                    const yLow   = projectPriceToY(candle.low);

                    const isBullish = candle.close >= candle.open;
                    const themeColor = isBullish ? '#22c55e' : '#ef4444';

                    ctx.strokeStyle = themeColor;
                    ctx.fillStyle = themeColor;
                    ctx.lineWidth = 2;

                    ctx.beginPath();
                    ctx.moveTo(pixelX + (nodeWidth / 2), yHigh);
                    ctx.lineTo(pixelX + (nodeWidth / 2), yLow);
                    ctx.stroke();

                    const blockTop = Math.min(yOpen, yClose);
                    const blockHeight = Math.max(3, Math.abs(yOpen - yClose));
                    ctx.fillRect(pixelX, blockTop, nodeWidth, blockHeight);
                }
            }

            async function pullCloudMarketState() {
                try {
                    const response = await fetch('/api/market-data');
                    const data = await response.json();

                    if (data && data.heatmap && data.heatmap.length > 0) {
                        // Locate this block inside the pullCloudMarketState function
if (footerText) {
    if (data.source === "MT5") {
        footerText.innerText = "🟢 Status: Linked with Active Home MT5 Data Bridge";
    } else if (data.source === "Cloud_Bybit") {
        footerText.innerHTML = "🔵 Status: MT5 Standby • <span style='color:#38bdf8;'>Streaming Bybit Institutional Feed</span>";
    } else if (data.source === "Cloud_Binance") {
        footerText.innerHTML = "🟡 Status: MT5 Standby • <span style='color:#eab308;'>Streaming Binance Cloud Feed</span>";
    } else {
        footerText.innerHTML = "🔴 Status: <span style='color:#f87171;'>All feeds blocked. Retrying...</span>";
    }
}

                        }
                        renderMatrixFrame(data.heatmap, data.candles);
                    }
                } catch (error) {
                    console.error("Cloud synchronization loop delayed:", error);
                }
            }

            setInterval(pullCloudMarketState, 3000);
            pullCloudMarketState();
        })();
    </script>
</body>
</html>
